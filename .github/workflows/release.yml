name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-arch-and-bottle:
    name: Arch Linux Package & Homebrew Bottle
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
    steps:
      - name: Install Arch Linux Dependencies
        run: |
          pacman -Syu --noconfirm base-devel git cmake ninja qt6-base qt6-declarative qt6-svg qt6-wayland libnotify libheif imagemagick ttf-dejavu python tar gzip curl jq openssh ruby

      - name: Checkout Tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Extract Version
        id: vars
        run: |
          if [ -n "${GITHUB_REF_NAME}" ] && [[ "${GITHUB_REF_NAME}" == v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER=$(grep -m1 "project(bluepill VERSION" CMakeLists.txt | sed -E 's/.*VERSION ([0-9.]+).*/\1/')
          fi
          echo "version=${VER}" >> $GITHUB_OUTPUT
          echo "Building BluePill version: ${VER}"

      - name: Build & Run Unit Tests (makepkg)
        run: |
          useradd -m builder
          chown -R builder:builder .
          su builder -c "cd pkgbuild && makepkg -fs --noconfirm"
          ls -lh pkgbuild/*.pkg.tar.zst

      - name: Build Homebrew Universal Bottles
        run: |
          VER="${{ steps.vars.outputs.version }}"
          BOTTLE_DIR="/tmp/bottle-build/bluepill/${VER}"
          mkdir -p "${BOTTLE_DIR}/bin"

          install -m 755 server/bluepill_server.py "${BOTTLE_DIR}/bin/bluepill-server"
          ln -s bluepill-server "${BOTTLE_DIR}/bin/imsgd"
          [ -f LICENSE ] && cp LICENSE "${BOTTLE_DIR}/"
          [ -f README.md ] && cp README.md "${BOTTLE_DIR}/"

          cat <<EOF > "${BOTTLE_DIR}/INSTALL_RECEIPT.json"
          {
            "homebrew_version": "4.2.0",
            "used_options": [],
            "unused_options": [],
            "built_as_bottle": true,
            "poured_from_bottle": false,
            "installed_as_dependency": false,
            "installed_on_request": true,
            "changed_files": null,
            "time": $(date +%s),
            "source_modified_time": $(date +%s),
            "source": {
              "spec": "stable",
              "versions": {
                "stable": "${VER}",
                "version_scheme": 0
              }
            }
          }
          EOF

          cd /tmp/bottle-build
          tar -czf "${GITHUB_WORKSPACE}/bluepill-${VER}.all.bottle.tar.gz" bluepill/
          cp "${GITHUB_WORKSPACE}/bluepill-${VER}.all.bottle.tar.gz" "${GITHUB_WORKSPACE}/bluepill--${VER}.all.bottle.tar.gz"
          cd "${GITHUB_WORKSPACE}"

      - name: Stage Arch & Bottle Artifacts
        run: |
          mkdir -p dist-arch
          cp pkgbuild/*.pkg.tar.zst dist-arch/
          cp bluepill-*.all.bottle.tar.gz dist-arch/

      - name: Upload Arch & Bottle Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-arch-bottle
          path: dist-arch/*

  build-deb:
    name: Debian/Ubuntu (.deb) Package
    runs-on: ubuntu-24.04
    steps:
      - name: Install Ubuntu 24.04 Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake ninja-build dpkg-dev qt6-base-dev qt6-declarative-dev qt6-svg-dev qml6-module-qtqml qml6-module-qtqml-models qml6-module-qtqml-workerscript qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-shapes qml6-module-qtquick-templates qml6-module-qtquick-window qt6-image-formats-plugins libqt6svg6 libnotify-bin imagemagick libheif-examples libheif-plugin-libde265 libheif-plugin-x265

      - name: Checkout Tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build & Package (.deb)
        run: ./packaging/build-deb.sh dist-deb

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-deb
          path: dist-deb/*.deb

  build-rpm:
    name: Fedora (.rpm) Package
    runs-on: ubuntu-latest
    container:
      image: fedora:41
    steps:
      - name: Install Fedora 41 Dependencies
        run: |
          dnf install -y -q rpm-build cmake gcc-c++ ninja-build qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtsvg-devel libnotify ImageMagick ImageMagick-heic libheif-tools

      - name: Checkout Tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build & Package (.rpm)
        run: ./packaging/build-rpm.sh dist-rpm

      - name: Upload .rpm Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-rpm
          path: dist-rpm/*.rpm

  build-windows:
    name: Windows Installer (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtimageformats'

      - name: Configure, Build & Test (CMake + MSVC)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if (-not (Get-Command magick -ErrorAction SilentlyContinue)) {
              choco install imagemagick -y --no-progress
              $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          }
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure

      - name: Deploy Qt6 Runtime & Build Inno Setup Installer
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -and $env:GITHUB_REF_NAME.StartsWith("v")) {
              $ver = $env:GITHUB_REF_NAME.Substring(1)
          } else {
              $ver = (Select-String -Path CMakeLists.txt -Pattern 'project\(bluepill VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          }
          New-Item -ItemType Directory -Force -Path build-win-dist | Out-Null
          Copy-Item build\Release\bluepill.exe build-win-dist\bluepill.exe
          $windeploy = Join-Path $env:Qt6_DIR "bin\windeployqt6.exe"
          if (-not (Test-Path $windeploy)) {
              $windeploy = Join-Path $env:Qt6_DIR "bin\windeployqt.exe"
          }
          & $windeploy --release --qmldir src --no-translations build-win-dist\bluepill.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $iscc = Get-Command iscc -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $iscc) {
              $defaultIscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
              if (Test-Path $defaultIscc) {
                  $iscc = $defaultIscc
              } else {
                  choco install innosetup -y --no-progress
                  $iscc = $defaultIscc
              }
          }
          & $iscc "/DAppVersion=$ver" "/DDistDir=..\build-win-dist" installer\bluepill.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/BluePill-Setup-*.exe

  publish-release:
    name: Publish GitHub Release & Sync Package Managers
    needs: [build-arch-and-bottle, build-deb, build-rpm, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download All Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-raw

      - name: Flatten & Generate SHA256 Checksums
        run: |
          mkdir -p dist
          find dist-raw -type f -exec cp -v {} dist/ \;
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
          generate_release_notes: true

      - name: Optional Sync to Homebrew Tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo "::notice ::HOMEBREW_TAP_TOKEN not configured. Skipping automated Homebrew Tap commit."
            exit 0
          fi
          VER="${{ needs.build-arch-and-bottle.outputs.version }}"
          SRC_URL="https://github.com/nertwork/bluepill/archive/refs/tags/v${VER}.tar.gz"
          SRC_TMP="/tmp/bluepill-v${VER}.tar.gz"
          curl -fsSL "${SRC_URL}" -o "${SRC_TMP}"
          SRC_SHA=$(sha256sum "${SRC_TMP}" | awk '{print $1}')
          rm -f "${SRC_TMP}"
          BOTTLE_SHA=$(grep "bluepill-${VER}.all.bottle.tar.gz" dist/SHA256SUMS.txt | awk '{print $1}')
          if [ -z "${SRC_SHA}" ] || [ -z "${BOTTLE_SHA}" ]; then
            echo "::error ::Missing release checksum(s): src=${SRC_SHA} bottle=${BOTTLE_SHA}"
            exit 1
          fi
          echo "Computed release checksums for v${VER}: src=${SRC_SHA} bottle=${BOTTLE_SHA}"
          git clone https://x-access-token:${TAP_TOKEN}@github.com/nertwork/homebrew-tap.git /tmp/gh-homebrew-tap
          cp Formula/bluepill.rb /tmp/gh-homebrew-tap/Formula/bluepill.rb
          VER="${VER}" SRC_URL="${SRC_URL}" SRC_SHA="${SRC_SHA}" BOTTLE_SHA="${BOTTLE_SHA}" python3 - <<'PY'
          import os, pathlib, re
          ver = os.environ["VER"]
          src_url = os.environ["SRC_URL"]
          src_sha = os.environ["SRC_SHA"]
          bottle_sha = os.environ["BOTTLE_SHA"]
          p = pathlib.Path("/tmp/gh-homebrew-tap/Formula/bluepill.rb")
          txt = p.read_text(encoding="utf-8")
          txt = re.sub(r'url "https://github\.com/nertwork/bluepill/archive/refs/tags/v[^"]+\.tar\.gz"', f'url "{src_url}"', txt, count=1)
          txt = re.sub(r'sha256 "[0-9a-f]{64}"', f'sha256 "{src_sha}"', txt, count=1)
          txt = re.sub(r'version "[^"]+"', f'version "{ver}"', txt, count=1)
          txt = re.sub(r'root_url "https://github\.com/nertwork/bluepill/releases/download/v[^"]+"', f'root_url "https://github.com/nertwork/bluepill/releases/download/v{ver}"', txt, count=1)
          txt = re.sub(r'sha256 cellar: :any_skip_relocation, all: "[0-9a-f]{64}"', f'sha256 cellar: :any_skip_relocation, all: "{bottle_sha}"', txt, count=1)
          txt = re.sub(r'assert_match "bluepill-server [^"]+"', f'assert_match "bluepill-server {ver}"', txt, count=1)
          p.write_text(txt, encoding="utf-8")
          PY
          ruby -c /tmp/gh-homebrew-tap/Formula/bluepill.rb
          cd /tmp/gh-homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/bluepill.rb
          if ! git diff-index --quiet HEAD; then
            git commit -m "feat(bluepill): update formula to v${VER}"
            git push origin main
          fi

      - name: Optional Sync to AUR
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "${AUR_KEY}" ]; then
            echo "::notice ::AUR_SSH_PRIVATE_KEY not configured. Skipping automated AUR commit."
            exit 0
          fi
          echo "Automated AUR push enabled via SSH key."
          VER="${{ needs.build-arch-and-bottle.outputs.version }}"
          SRC_URL="https://github.com/nertwork/bluepill/archive/refs/tags/v${VER}.tar.gz"
          SRC_TMP="/tmp/bluepill-aur-v${VER}.tar.gz"
          curl -fsSL "${SRC_URL}" -o "${SRC_TMP}"
          SRC_SHA=$(sha256sum "${SRC_TMP}" | awk '{print $1}')
          rm -f "${SRC_TMP}"
          if [ -z "${SRC_SHA}" ]; then
            echo "::error ::Failed to compute v${VER} archive checksum for AUR PKGBUILD"
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "${AUR_KEY}" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_key" git clone ssh://aur@aur.archlinux.org/bluepill.git /tmp/aur-bluepill
          cp pkgbuild/PKGBUILD.aur /tmp/aur-bluepill/PKGBUILD
          VER="${VER}" SRC_SHA="${SRC_SHA}" python3 - <<'PY'
          import os, pathlib, re
          ver = os.environ["VER"]
          sha = os.environ["SRC_SHA"]
          p = pathlib.Path("/tmp/aur-bluepill/PKGBUILD")
          txt = p.read_text(encoding="utf-8")
          txt = re.sub(r'^pkgver=.*$', f'pkgver={ver}', txt, count=1, flags=re.M)
          txt = re.sub(r'^pkgrel=.*$', 'pkgrel=1', txt, count=1, flags=re.M)
          txt = re.sub(r"^sha256sums=\('[^']+'\)", f"sha256sums=('{sha}')", txt, count=1, flags=re.M)
          p.write_text(txt, encoding="utf-8")
          PY
          mkdir -p /tmp/aur-build
          chmod 777 /tmp/aur-build
          useradd -m builder || true
          chown -R builder:builder /tmp/aur-bluepill
          su builder -c "cd /tmp/aur-bluepill && makepkg --printsrcinfo > .SRCINFO"
          chown -R root:root /tmp/aur-bluepill
          cd /tmp/aur-bluepill
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(release): bump to v${VER}"
            GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_key" git push origin master
          fi
